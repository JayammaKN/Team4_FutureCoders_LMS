name: Playwright BDD Tests
on:
  push:
    branches: [ main, master, Jaya_08_05 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      LMS_URL: ${{ secrets.LMS_URL }}
      LMS_USERNAME: ${{ secrets.LMS_USERNAME }}
      LMS_PASSWORD: ${{ secrets.LMS_PASSWORD }}
      LMS_ROLE: ${{ secrets.LMS_ROLE }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers (Linux)
      run: npx playwright install --with-deps
      if: runner.os == 'Linux'
    - name: Install Playwright Browsers (macOS/Windows)
      run: npx playwright install
      if: runner.os != 'Linux'
    - name: Generate BDD specs
      run: npx bddgen
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.os }}
        path: playwright-report/
        retention-days: 7
